name: C++ build and tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake

      - name: Configure
        run: cmake -S TaskFlow -B TaskFlow/build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build TaskFlow/build-ci --parallel

      - name: Run tests
        run: ctest --test-dir TaskFlow/build-ci --output-on-failure
